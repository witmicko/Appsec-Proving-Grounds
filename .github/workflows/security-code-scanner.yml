name: "MetaMask Security Code Scanner"

on:
  workflow_dispatch:
    inputs:
      paths_ignored:
        description: 'Comma delimited paths to ignore during scan' 
        required: false
        default: 'data'
      rules_excluded:
        description: 'Comma delimited IDs of rules to exclude' 
        required: false
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  run-security-scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: MetaMask Security Code Scanner
        uses: MetaMask/Security-Code-Scanner@dev-custom-queries
        with:
          repo: ${{ github.repository }}
          paths_ignored: |
            e2e/
            docs/
            storybook/
            .storybook/
            '**/*.test.js'
            '**/*.test.ts'
            '**/*.test.jsx'
            '**/*.test.tsx'
            '**/*.stories.tsx'
            '**/*.stories.js'
            '**/*.snap'
          rules_excluded: example
          project_metrics_token: ${{secrets.SECURITY_SCAN_METRICS_TOKEN}}
          slack_webhook: ${{ secrets.APPSEC_BOT_SLACK_WEBHOOK }}